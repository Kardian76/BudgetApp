<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Debt Snowball Tracker - Pay down your debts systematically">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Debt Snowball">
    
    <title>Debt Snowball Tracker</title>
    
    <link rel="manifest" href="/BudgetApp/snowball-manifest.json">
    <link rel="icon" type="image/png" sizes="128x128" href="/BudgetApp/snowball-icon-128.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/BudgetApp/snowball-icon-512.png">
    <link rel="apple-touch-icon" href="/BudgetApp/snowball-icon-512.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --accent-primary: #10b981;
            --accent-secondary: #3b82f6;
            --accent-danger: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border: #475569;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 16px 100px;
        }

        header {
            position: sticky;
            top: 0;
            background: var(--bg-primary);
            border-bottom: 2px solid var(--accent-primary);
            padding: 20px 16px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            color: var(--accent-primary);
            text-transform: uppercase;
        }

        .settings-btn {
            background: transparent;
            border: 2px solid var(--accent-primary);
            color: var(--accent-primary);
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 1px;
            font-size: 1rem;
        }

        .settings-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            transform: translateY(-2px);
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .summary-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            transition: transform 0.2s;
        }

        .summary-card:hover {
            transform: translateY(-2px);
        }

        .summary-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .summary-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.75rem;
            color: var(--accent-primary);
            letter-spacing: 1px;
        }

        .priority-selector {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .priority-label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }

        .priority-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .priority-btn {
            flex: 1;
            min-width: 80px;
            padding: 10px 16px;
            background: var(--bg-tertiary);
            border: 2px solid transparent;
            color: var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .priority-btn.active {
            background: var(--accent-primary);
            color: var(--bg-primary);
            border-color: var(--accent-primary);
        }

        .extra-payment-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .extra-payment-input {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .input-group {
            flex: 1;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .apply-payment-btn {
            background: var(--accent-primary);
            color: var(--bg-primary);
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 1px;
            font-size: 1.1rem;
            transition: all 0.2s;
            width: 100%;
        }

        .apply-payment-btn:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .debt-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .debt-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent-secondary);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .debt-card.priority-1 {
            border-left-color: var(--accent-primary);
            border-left-width: 6px;
        }

        .debt-card:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .debt-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 16px;
        }

        .debt-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: var(--text-primary);
        }

        .debt-priority {
            background: var(--accent-primary);
            color: var(--bg-primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .debt-card.priority-1 .debt-priority {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .debt-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .debt-stat {
            display: flex;
            flex-direction: column;
        }

        .debt-stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .debt-stat-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .debt-progress {
            margin-top: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .progress-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
            text-align: right;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state-text {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            z-index: 10;
        }

        .modal-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.75rem;
            letter-spacing: 2px;
            color: var(--accent-primary);
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .btn-primary {
            background: var(--accent-primary);
            color: var(--bg-primary);
            border: none;
            padding: 14px 28px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 1px;
            font-size: 1.1rem;
            width: 100%;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .debt-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .debt-item-info {
            flex: 1;
        }

        .debt-item-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .debt-item-details {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .btn-danger {
            background: var(--accent-danger);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .add-debt-btn {
            background: transparent;
            border: 2px dashed var(--border);
            color: var(--text-muted);
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .add-debt-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-primary);
            color: var(--bg-primary);
            padding: 16px 24px;
            border-radius: 8px;
            font-weight: 600;
            box-shadow: 0 4px 12px var(--shadow);
            z-index: 2000;
            animation: slideUpToast 0.3s;
            display: none;
        }

        .toast.active {
            display: block;
        }

        @keyframes slideUpToast {
            from { transform: translate(-50%, 50px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        /* Custom Order Drag Styles */
        .debt-item.dragging {
            opacity: 0.5;
        }

        .debt-item.drag-over {
            border-color: var(--accent-primary);
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 1.5rem;
            }

            .summary-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .debt-stats {
                grid-template-columns: 1fr;
            }

            .extra-payment-input {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Debt Snowball</h1>
            <button class="settings-btn" onclick="openSettings()">Settings</button>
        </div>
    </header>

    <div class="container">
        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="summary-card">
                <div class="summary-label">Total Debt</div>
                <div class="summary-value" id="totalDebt">$0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Total Paid</div>
                <div class="summary-value" id="totalPaid">$0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Debts Remaining</div>
                <div class="summary-value" id="debtsRemaining">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Debt Free Date</div>
                <div class="summary-value" id="debtFreeDate">--</div>
            </div>
        </div>

        <!-- Priority Selector -->
        <div class="priority-selector">
            <div class="priority-label">Sort Debts By</div>
            <div class="priority-buttons">
                <button class="priority-btn active" data-priority="balance" onclick="changePriority('balance')">
                    Lowest Balance
                </button>
                <button class="priority-btn" data-priority="interest" onclick="changePriority('interest')">
                    Highest Interest
                </button>
                <button class="priority-btn" data-priority="custom" onclick="changePriority('custom')">
                    Custom Order
                </button>
            </div>
        </div>

        <!-- Extra Payment Section -->
        <div class="extra-payment-section">
            <div class="extra-payment-input">
                <div class="input-group">
                    <label for="extraAmount">Extra Payment Amount</label>
                    <input type="number" id="extraAmount" placeholder="0.00" min="0" step="0.01">
                </div>
                <div class="input-group">
                    <label for="targetDebt">Target Debt</label>
                    <select id="targetDebt">
                        <option value="priority">Priority #1 (Default)</option>
                    </select>
                </div>
            </div>
            <button class="apply-payment-btn" onclick="applyExtraPayment()">Apply Payment</button>
        </div>

        <!-- Debt List -->
        <div class="debt-list" id="debtList">
            <div class="empty-state">
                <div class="empty-state-icon">📊</div>
                <div class="empty-state-text">
                    No debts added yet.<br>
                    Click Settings to get started.
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Manage Debts</h2>
                <button class="close-btn" onclick="closeSettings()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="debtListSettings"></div>
                <button class="add-debt-btn" onclick="openAddDebtForm()">+ Add New Debt</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Debt Modal -->
    <div class="modal" id="debtFormModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="formModalTitle">Add Debt</h2>
                <button class="close-btn" onclick="closeDebtForm()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="debtForm" onsubmit="saveDebt(event)">
                    <input type="hidden" id="debtId">
                    
                    <div class="form-group">
                        <label for="debtName">Debt Name *</label>
                        <input type="text" id="debtName" required placeholder="e.g., Credit Card">
                    </div>

                    <div class="form-group">
                        <label for="originalBalance">Original Balance *</label>
                        <input type="number" id="originalBalance" required min="0" step="0.01" placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label for="currentBalance">Current Balance *</label>
                        <input type="number" id="currentBalance" required min="0" step="0.01" placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label for="interestRate">Interest Rate (%) *</label>
                        <input type="number" id="interestRate" required min="0" max="100" step="0.01" placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label for="minimumPayment">Minimum Monthly Payment *</label>
                        <input type="number" id="minimumPayment" required min="0" step="0.01" placeholder="0.00">
                    </div>

                    <button type="submit" class="btn-primary">Save Debt</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script>
// Configuration
const CONFIG = {
  USE_CLOUD_SYNC: true,
  API_URL: 'https://purrfect-snowball.kardian.workers.dev/api',
  AUTH_TOKEN: ''
};

// State Management
let debts = [];
let priorityMode = 'balance';
let currentEditId = null;

// Initialize app
document.addEventListener('DOMContentLoaded', () => {
  loadDebts();
});

// API Helper
async function apiRequest(endpoint, options = {}) {
  const headers = {
    'Content-Type': 'application/json'
  };
  
  if (CONFIG.AUTH_TOKEN) {
    headers['Authorization'] = `Bearer ${CONFIG.AUTH_TOKEN}`;
  }

  try {
    const response = await fetch(`${CONFIG.API_URL}${endpoint}`, {
      ...options,
      headers: { ...headers, ...options.headers }
    });

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(errorText || `HTTP ${response.status}`);
    }

    return await response.json();
  } catch (err) {
    console.error('API Error:', err);
    showToast('Error: ' + err.message);
    throw err;
  }
}

// Load debts from API
async function loadDebts() {
  try {
    debts = await apiRequest('/debts', { method: 'GET' });
    render();
  } catch (err) {
    console.error('Failed to load debts:', err);
  }
}

// Save debt to API
async function saveDebtToAPI(debt, isUpdate = false) {
  const method = isUpdate ? 'PUT' : 'POST';
  await apiRequest('/debts', {
    method,
    body: JSON.stringify(debt)
  });
}

// Delete debt from API
async function deleteDebtFromAPI(id) {
  await apiRequest(`/debts?id=${id}`, { method: 'DELETE' });
}

// Priority Management
function changePriority(mode) {
  priorityMode = mode;
  
  document.querySelectorAll('.priority-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.dataset.priority === mode) {
      btn.classList.add('active');
    }
  });
  
  render();
}

// Calculate debt payoff details
function calculateDebtDetails(debt) {
  const monthlyRate = (debt.interest_rate / 100) / 12;
  const currentBalance = debt.current_balance;
  const minimumPayment = debt.minimum_payment;
  
  if (minimumPayment === 0 || monthlyRate === 0) {
    const months = Math.ceil(currentBalance / (minimumPayment || 1));
    return {
      monthsRemaining: months,
      payoffDate: new Date(Date.now() + months * 30 * 24 * 60 * 60 * 1000)
    };
  }
  
  let balance = currentBalance;
  let months = 0;
  const maxMonths = 600;
  
  while (balance > 0 && months < maxMonths) {
    const interest = balance * monthlyRate;
    const principal = minimumPayment - interest;
    
    if (principal <= 0) {
      months = maxMonths;
      break;
    }
    
    balance -= principal;
    months++;
  }
  
  const payoffDate = new Date();
  payoffDate.setMonth(payoffDate.getMonth() + months);
  
  return {
    monthsRemaining: months,
    payoffDate
  };
}

// Sort debts based on priority
function sortDebts() {
  const sorted = [...debts];
  
  if (priorityMode === 'balance') {
    sorted.sort((a, b) => a.current_balance - b.current_balance);
  } else if (priorityMode === 'interest') {
    sorted.sort((a, b) => b.interest_rate - a.interest_rate);
  }
  
  return sorted;
}

// Calculate summary statistics
function calculateSummary() {
  const totalDebt = debts.reduce((sum, d) => sum + d.current_balance, 0);
  const totalOriginal = debts.reduce((sum, d) => sum + d.original_balance, 0);
  const totalPaid = totalOriginal - totalDebt;
  const debtsRemaining = debts.filter(d => d.current_balance > 0).length;
  
  let latestPayoff = null;
  debts.forEach(debt => {
    if (debt.current_balance > 0) {
      const details = calculateDebtDetails(debt);
      if (!latestPayoff || details.payoffDate > latestPayoff) {
        latestPayoff = details.payoffDate;
      }
    }
  });
  
  return {
    totalDebt,
    totalPaid,
    debtsRemaining,
    debtFreeDate: latestPayoff
  };
}

// Format currency
function formatCurrency(amount) {
  return new Intl.NumberFormat('en-US', {
    style: 'currency',
    currency: 'USD',
    minimumFractionDigits: 0,
    maximumFractionDigits: 0
  }).format(amount);
}

// Format date
function formatDate(date) {
  if (!date) return '--';
  return new Intl.DateFormat('en-US', {
    month: 'short',
    year: 'numeric'
  }).format(date);
}

// Render the entire UI
function render() {
  renderSummary();
  renderDebtList();
  renderTargetDebtSelector();
}

// Render summary cards
function renderSummary() {
  const summary = calculateSummary();
  
  document.getElementById('totalDebt').textContent = formatCurrency(summary.totalDebt);
  document.getElementById('totalPaid').textContent = formatCurrency(summary.totalPaid);
  document.getElementById('debtsRemaining').textContent = summary.debtsRemaining;
  document.getElementById('debtFreeDate').textContent = formatDate(summary.debtFreeDate);
}

// Render debt list
function renderDebtList() {
  const debtListEl = document.getElementById('debtList');
  const sortedDebts = sortDebts();
  
  if (sortedDebts.length === 0) {
    debtListEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📊</div>
        <div class="empty-state-text">
          No debts added yet.<br>
          Click Settings to get started.
        </div>
      </div>
    `;
    return;
  }
  
  debtListEl.innerHTML = sortedDebts.map((debt, index) => {
    const details = calculateDebtDetails(debt);
    const progress = ((debt.original_balance - debt.current_balance) / debt.original_balance) * 100;
    const priorityClass = index === 0 ? 'priority-1' : '';
    
    return `
      <div class="debt-card ${priorityClass}">
        <div class="debt-header">
          <div class="debt-name">${escapeHtml(debt.name)}</div>
          <div class="debt-priority">#${index + 1}</div>
        </div>
        <div class="debt-stats">
          <div class="debt-stat">
            <div class="debt-stat-label">Original</div>
            <div class="debt-stat-value">${formatCurrency(debt.original_balance)}</div>
          </div>
          <div class="debt-stat">
            <div class="debt-stat-label">Current</div>
            <div class="debt-stat-value">${formatCurrency(debt.current_balance)}</div>
          </div>
          <div class="debt-stat">
            <div class="debt-stat-label">Interest Rate</div>
            <div class="debt-stat-value">${debt.interest_rate.toFixed(2)}%</div>
          </div>
          <div class="debt-stat">
            <div class="debt-stat-label">Min Payment</div>
            <div class="debt-stat-value">${formatCurrency(debt.minimum_payment)}</div>
          </div>
          <div class="debt-stat">
            <div class="debt-stat-label">Months Left</div>
            <div class="debt-stat-value">${details.monthsRemaining}</div>
          </div>
          <div class="debt-stat">
            <div class="debt-stat-label">Payoff Date</div>
            <div class="debt-stat-value">${formatDate(details.payoffDate)}</div>
          </div>
        </div>
        <div class="debt-progress">
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progress}%"></div>
          </div>
          <div class="progress-text">${progress.toFixed(1)}% paid</div>
        </div>
      </div>
    `;
  }).join('');
}

// Render target debt selector
function renderTargetDebtSelector() {
  const selectEl = document.getElementById('targetDebt');
  const sortedDebts = sortDebts();
  
  selectEl.innerHTML = '<option value="priority">Priority #1 (Default)</option>' +
    sortedDebts.map((debt, index) => 
      `<option value="${debt.id}">${escapeHtml(debt.name)} (#${index + 1})</option>`
    ).join('');
}

// Apply extra payment
async function applyExtraPayment() {
  const amount = parseFloat(document.getElementById('extraAmount').value);
  const target = document.getElementById('targetDebt').value;
  
  if (!amount || amount <= 0) {
    showToast('Please enter a valid payment amount');
    return;
  }
  
  let targetDebt;
  if (target === 'priority') {
    const sortedDebts = sortDebts();
    targetDebt = sortedDebts[0];
  } else {
    targetDebt = debts.find(d => d.id === target);
  }
  
  if (!targetDebt) {
    showToast('Debt not found');
    return;
  }
  
  targetDebt.current_balance = Math.max(0, targetDebt.current_balance - amount);
  
  document.getElementById('extraAmount').value = '';
  
  try {
    await saveDebtToAPI(targetDebt, true);
    await loadDebts();
    showToast(`Payment of ${formatCurrency(amount)} applied to ${targetDebt.name}!`);
  } catch (err) {
    console.error('Failed to apply payment:', err);
  }
}

// Settings Modal
function openSettings() {
  renderDebtListSettings();
  document.getElementById('settingsModal').classList.add('active');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('active');
  render();
}

function renderDebtListSettings() {
  const container = document.getElementById('debtListSettings');
  const sortedDebts = sortDebts();
  
  if (sortedDebts.length === 0) {
    container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">No debts yet. Add your first debt below.</p>';
    return;
  }
  
  container.innerHTML = sortedDebts.map((debt, index) => `
    <div class="debt-item" data-id="${debt.id}">
      <div class="debt-item-info">
        <div class="debt-item-name">${escapeHtml(debt.name)}</div>
        <div class="debt-item-details">
          ${formatCurrency(debt.current_balance)} at ${debt.interest_rate}% APR
        </div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn-primary" style="width: auto; padding: 8px 16px;" onclick="editDebt('${debt.id}')">Edit</button>
        <button class="btn-danger" onclick="deleteDebt('${debt.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

// Add/Edit Debt Form
function openAddDebtForm() {
  currentEditId = null;
  document.getElementById('formModalTitle').textContent = 'Add Debt';
  document.getElementById('debtForm').reset();
  document.getElementById('debtId').value = '';
  document.getElementById('debtFormModal').classList.add('active');
}

function editDebt(id) {
  const debt = debts.find(d => d.id === id);
  if (!debt) return;
  
  currentEditId = id;
  document.getElementById('formModalTitle').textContent = 'Edit Debt';
  document.getElementById('debtId').value = debt.id;
  document.getElementById('debtName').value = debt.name;
  document.getElementById('originalBalance').value = debt.original_balance;
  document.getElementById('currentBalance').value = debt.current_balance;
  document.getElementById('interestRate').value = debt.interest_rate;
  document.getElementById('minimumPayment').value = debt.minimum_payment;
  
  document.getElementById('debtFormModal').classList.add('active');
}

function closeDebtForm() {
  document.getElementById('debtFormModal').classList.remove('active');
}

async function saveDebt(e) {
  e.preventDefault();
  
  const id = document.getElementById('debtId').value || crypto.randomUUID();
  const debtData = {
    id,
    name: document.getElementById('debtName').value,
    originalBalance: parseFloat(document.getElementById('originalBalance').value),
    currentBalance: parseFloat(document.getElementById('currentBalance').value),
    interestRate: parseFloat(document.getElementById('interestRate').value),
    minimumPayment: parseFloat(document.getElementById('minimumPayment').value),
    customOrder: 999
  };
  
  const existingIndex = debts.findIndex(d => d.id === id);
  const isUpdate = existingIndex >= 0;
  
  try {
    await saveDebtToAPI(debtData, isUpdate);
    await loadDebts();
    
    closeDebtForm();
    renderDebtListSettings();
    showToast(isUpdate ? 'Debt updated successfully!' : 'Debt added successfully!');
  } catch (err) {
    console.error('Failed to save debt:', err);
  }
}

async function deleteDebt(id) {
  if (!confirm('Are you sure you want to delete this debt?')) {
    return;
  }
  
  try {
    await deleteDebtFromAPI(id);
    await loadDebts();
    renderDebtListSettings();
    showToast('Debt deleted');
  } catch (err) {
    console.error('Failed to delete debt:', err);
  }
}

// Utility functions
function escapeHtml(text) {
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, m => map[m]);
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('active');
  
  setTimeout(() => {
    toast.classList.remove('active');
  }, 3000);
}

// Close modals on background click
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('modal')) {
    e.target.classList.remove('active');
  }
});

// Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('/BudgetApp/snowball-sw.js', {
        scope: '/BudgetApp/'
      });
      console.log('✅ Service Worker registered:', reg.scope);
    } catch (err) {
      console.error('❌ Service Worker registration failed:', err);
    }
  });
}
