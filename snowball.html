<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debt Snowball Tracker</title>

<link rel="manifest" href="/snowball-manifest.json">
<meta name="theme-color" content="#111827">

<style>
body {
  font-family: system-ui, -apple-system, sans-serif;
  margin: 0;
  background: #f3f4f6;
}

header {
  background: #111827;
  color: white;
  padding: 1rem;
  text-align: center;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 1rem;
}

.card {
  background: white;
  padding: 1rem;
  margin-bottom: 1rem;
  border-radius: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}

input, button {
  padding: 0.5rem;
  margin: 0.25rem 0;
  width: 100%;
  box-sizing: border-box;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
}

button.danger {
  background: #dc2626;
}

.offline {
  background: #fbbf24;
  padding: 0.5rem;
  text-align: center;
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>Debt Snowball Tracker</h1>
</header>

<div class="offline" id="offlineBanner">
  Offline Mode – Changes will sync when reconnected
</div>

<div class="container">

  <div class="card">
    <h2>Add Debt</h2>
    <input id="name" placeholder="Debt Name">
    <input id="originalBalance" type="number" placeholder="Original Balance">
    <input id="currentBalance" type="number" placeholder="Current Balance">
    <input id="interestRate" type="number" placeholder="Interest Rate (%)">
    <input id="minimumPayment" type="number" placeholder="Minimum Payment">
    <button onclick="addDebt()">Add Debt</button>
  </div>

  <div class="card">
    <h2>Your Debts</h2>
    <div id="debtList"></div>
  </div>

</div>

<script>
// =============================
// CONFIG
// =============================
const API_BASE = '/api';
const AUTH_TOKEN = localStorage.getItem('snowball_token') || '';

if (!AUTH_TOKEN) {
  const token = prompt("Enter Shared Access Token:");
  if (token) {
    localStorage.setItem('snowball_token', token);
    location.reload();
  }
}

// =============================
// NETWORK STATUS
// =============================
function updateOnlineStatus() {
  document.getElementById('offlineBanner').style.display =
    navigator.onLine ? 'none' : 'block';
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

// =============================
// API HELPER (Network First)
// =============================
async function apiRequest(endpoint, options = {}) {
  const headers = {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${localStorage.getItem('snowball_token')}`
  };

  try {
    const response = await fetch(`${API_BASE}${endpoint}`, {
      ...options,
      headers
    });

    if (!response.ok) {
      throw new Error(await response.text());
    }

    return await response.json();

  } catch (err) {
    console.error('API Error:', err);
    alert("Network error. If offline, changes cannot be saved.");
    throw err;
  }
}

// =============================
// LOAD DEBTS
// =============================
async function loadDebts() {
  try {
    const debts = await apiRequest('/debts', { method: 'GET' });
    renderDebts(debts);
  } catch {
    console.warn("Offline or API unavailable.");
  }
}

// =============================
// RENDER
// =============================
function renderDebts(debts) {
  const container = document.getElementById('debtList');
  container.innerHTML = '';

  debts.forEach(debt => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <strong>${debt.name}</strong><br>
      Balance: $${debt.current_balance}<br>
      Interest: ${debt.interest_rate}%<br>
      Minimum: $${debt.minimum_payment}<br>
      <button onclick="deleteDebt('${debt.id}')" class="danger">Delete</button>
    `;
    container.appendChild(div);
  });
}

// =============================
// ADD
// =============================
async function addDebt() {
  const debt = {
    id: crypto.randomUUID(),
    name: document.getElementById('name').value,
    originalBalance: parseFloat(document.getElementById('originalBalance').value),
    currentBalance: parseFloat(document.getElementById('currentBalance').value),
    interestRate: parseFloat(document.getElementById('interestRate').value),
    minimumPayment: parseFloat(document.getElementById('minimumPayment').value),
    customOrder: 999
  };

  await apiRequest('/debts', {
    method: 'POST',
    body: JSON.stringify(debt)
  });

  loadDebts();
}

// =============================
// DELETE
// =============================
async function deleteDebt(id) {
  await apiRequest(`/debts?id=${id}`, {
    method: 'DELETE'
  });

  loadDebts();
}

// =============================
// SERVICE WORKER
// =============================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    const reg = await navigator.serviceWorker.register('/service-worker.js');
    reg.update();

    reg.onupdatefound = () => {
      const newWorker = reg.installing;
      newWorker.onstatechange = () => {
        if (newWorker.state === 'installed' &&
            navigator.serviceWorker.controller) {
          location.reload();
        }
      };
    };
  });
}

// =============================
loadDebts();
</script>

</body>
</html>
